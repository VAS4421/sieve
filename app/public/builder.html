<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorecard Builder — Sieve</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/studio.css" />
</head>
<body class="bx">
  <!-- Top bar: back, the scorecard's name (editable), save state, preview and publish -->
  <header class="bx-top">
    <a href="/dashboard.html" class="bx-back" title="Back to your scorecards" aria-label="Back to your scorecards">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <img src="/logo.png" class="bx-logo" alt="Sieve" />
    <div class="bx-name">
      <input id="top-title" class="bx-name-input" placeholder="Untitled scorecard" aria-label="Scorecard name" />
      <span class="bx-save" id="save-status"><i></i><span>All changes saved</span></span>
    </div>
    <div class="bx-top-actions">
      <span class="bx-live-pill" id="live-pill" hidden>● Live</span>
      <button class="btn btn-ghost btn-sm" id="preview-btn">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Preview</span>
      </button>
      <button class="btn btn-primary btn-sm" id="publish-top">Publish</button>
    </div>
  </header>

  <div class="bx-body">
    <!-- Steps -->
    <nav class="bx-steps" id="steps" aria-label="Builder steps"></nav>

    <!-- The step being edited -->
    <main class="bx-editor">
      <div id="editor"></div>
      <div class="bx-nav" id="step-nav"></div>
    </main>

    <!-- Live phone preview of what a lead sees -->
    <aside class="bx-preview" id="preview-pane" aria-label="Live preview">
      <div class="bx-preview-head"><span>Live preview</span><small id="pv-caption">What a lead sees</small><button class="bx-pv-close" id="pv-close" aria-label="Close preview">×</button></div>
      <div class="bx-phone"><div class="bx-notch"></div><div class="bx-screen" id="pv"></div></div>
    </aside>
  </div>
  <button class="bx-pv-fab" id="pv-fab" type="button">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Preview
  </button>
  <input type="file" id="cover-upload-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden />

  <script src="/app.js"></script>
  <script>
  // Sieve builder, step by step. Every server call is the same as before:
  //   GET/PUT /api/scorecards/:id, POST /api/scorecards/:id/publish, POST /api/scorecards/upload-cover,
  //   GET /api/scorecards/:id/qr.png, and the public /take/index.html link.
  // What changed is the experience: guided steps, tap-to-score, autosave and a live phone preview.
  const params = new URLSearchParams(location.search);
  const scorecardId = params.get('id');
  if (!scorecardId) window.location.href = '/dashboard.html';

  let state = {
    title: '', intro: '', categories: [], questions: [], tiers: [], slug: '', published: false,
    profileCapture: { enabled: false, captureAge: false, captureGender: false, captureLocation: false, captureSocialClass: false, interestQuestion: '', interestOptions: [] },
    engagementMode: false, shareTemplate: '',
  };
  let USER = null;
  const STEPS = [
    { key: 'page', label: 'Landing page', sub: 'Title, intro and cover', icon: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 13h6M7 16h4"/>' },
    { key: 'questions', label: 'Questions & scoring', sub: 'What leads answer', icon: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/>' },
    { key: 'results', label: 'Results', sub: 'What each lead gets back', icon: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>' },
    { key: 'extras', label: 'Extras', sub: 'Audience data, sharing', icon: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>' },
    { key: 'share', label: 'Publish & share', sub: 'Go live, get your link', icon: '<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/>' },
  ];
  let step = (STEPS.find(s => s.key === location.hash.slice(1)) || STEPS[0]).key;
  let openQ = 0;            // which question card is expanded (and shown in the preview)
  let pvTier = 0;           // which result tier the preview shows
  const openInsight = new Set();
  let showCatMessages = false;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const brand = () => (state.brandName && state.brandName.trim()) || (USER && USER.business_name) || 'Your business';
  const liveUrl = () => `${location.origin}/take/index.html?slug=${state.slug}`;
  const LETTERS = 'ABCDEFGHIJKLMNOP';
  const TIER_COLORS = ['#16825D', '#C1501F', '#1F5FE0', '#8285A0', '#7C3AED'];
  function slugKey(text, existingKeys) {
    let base = text.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/(^_|_$)/g, '') || 'cat';
    let key = base, n = 1;
    while (existingKeys.includes(key)) { n += 1; key = `${base}${n}`; }
    return key;
  }
  const tierRange = (i) => { const t = state.tiers[i]; const above = i > 0 ? state.tiers[i - 1].min - 1 : 100; return `${t.min}–${above}%`; };

  /* ---------- autosave ---------- */
  let saveTimer = null, saving = false, dirty = false, saveAgain = false;
  function setStatus(kind, text) { const el = $('#save-status'); el.className = 'bx-save ' + kind; el.querySelector('span').textContent = text; }
  function changed() { dirty = true; setStatus('dirty', 'Unsaved changes'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200); drawPreview(); drawSteps(); }
  async function save() {
    clearTimeout(saveTimer);
    if (saving) { saveAgain = true; return; }
    saving = true; setStatus('saving', 'Saving…');
    try {
      const { scorecard } = await api(`/scorecards/${scorecardId}`, {
        method: 'PUT',
        body: {
          title: state.title, intro: state.intro, categories: state.categories, questions: state.questions,
          tiers: state.tiers, brandName: state.brandName, coverImage: state.coverImage, profileCapture: state.profileCapture,
          engagementMode: state.engagementMode, shareTemplate: state.shareTemplate,
        },
      });
      // keep what the person is typing; take the server's slug/published flags
      state.slug = scorecard.slug; state.published = scorecard.published;
      dirty = false; setStatus('saved', 'All changes saved');
    } catch (ex) {
      setStatus('error', 'Not saved, retrying');
      showToast(ex.message);
      clearTimeout(saveTimer); saveTimer = setTimeout(save, 4000);
    } finally {
      saving = false;
      if (saveAgain) { saveAgain = false; save(); }
    }
  }
  window.addEventListener('beforeunload', (e) => { if (dirty) { save(); e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });

  /* ---------- steps rail ---------- */
  function stepDone(key) {
    if (key === 'page') return !!state.title.trim() && !!state.intro.trim();
    if (key === 'questions') return state.questions.length > 0 && state.questions.every(q => q.text.trim() && q.options.length >= 2);
    if (key === 'results') return state.tiers.some(t => t.recommendationUrl);
    if (key === 'extras') return !!(state.profileCapture?.enabled || state.engagementMode);
    if (key === 'share') return !!state.published;
  }
  function drawSteps() {
    $('#steps').innerHTML = STEPS.map((s, i) => `
      <button class="bx-step ${s.key === step ? 'on' : ''} ${stepDone(s.key) ? 'done' : ''}" data-step="${s.key}" ${s.key === step ? 'aria-current="step"' : ''}>
        <span class="bx-step-n">${stepDone(s.key) ? '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : i + 1}</span>
        <span class="bx-step-t"><b>${s.label}</b><small>${s.sub}</small></span>
      </button>`).join('');
    $$('[data-step]', $('#steps')).forEach(b => b.onclick = () => go(b.dataset.step));
  }
  function go(key) { step = key; history.replaceState(null, '', '#' + key); drawAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function drawNav() {
    const i = STEPS.findIndex(s => s.key === step), prev = STEPS[i - 1], next = STEPS[i + 1];
    $('#step-nav').innerHTML = `${prev ? `<button class="btn btn-ghost" data-go="${prev.key}">← ${prev.label}</button>` : '<span></span>'}
      ${next ? `<button class="btn btn-primary" data-go="${next.key}">Next: ${next.label} →</button>` : ''}`;
    $$('[data-go]', $('#step-nav')).forEach(b => b.onclick = () => go(b.dataset.go));
  }
  function drawAll() { drawSteps(); drawEditor(); drawNav(); drawPreview(); drawTop(); }
  function drawTop() {
    if (document.activeElement !== $('#top-title')) $('#top-title').value = state.title;
    $('#live-pill').hidden = !state.published;
    const pt = $('#publish-top');
    pt.textContent = state.published ? 'Share' : 'Publish';
    pt.className = state.published ? 'btn btn-ghost btn-sm' : 'btn btn-primary btn-sm';
  }

  /* ---------- the editor for each step ---------- */
  function drawEditor() {
    const ed = $('#editor');
    ({ page: edPage, questions: edQuestions, results: edResults, extras: edExtras, share: edShare })[step](ed);
  }
  const head = (title, sub) => `<div class="bx-head"><h1>${title}</h1><p>${sub}</p></div>`;

  // 1. Landing page
  function edPage(ed) {
    ed.innerHTML = head('Landing page', 'The first thing a lead sees. Keep it short and promise a clear result.') + `
      <div class="bx-card">
        <label class="bx-field"><span>Scorecard title</span>
          <input id="f-title" maxlength="120" value="${esc(state.title)}" placeholder="e.g. Is your home ready for a makeover?" />
          <small>Tip: questions work well. "How ready is your business to grow?"</small></label>
        <label class="bx-field"><span>Intro</span>
          <textarea id="f-intro" rows="3" placeholder="One or two sentences on what they'll find out, and how long it takes.">${esc(state.intro)}</textarea></label>
        <div class="bx-chips" aria-label="Intro ideas">
          ${['Answer a few quick questions and get your personal score in 2 minutes.', 'Find out where you stand, and exactly what to do next.', 'Free, private and instant. See your results right away.'].map(t => `<button type="button" class="bx-chip" data-intro="${esc(t)}">+ ${esc(t)}</button>`).join('')}
        </div>
      </div>
      <div class="bx-card">
        <div class="bx-card-head"><h3>Cover image</h3><span class="bx-opt">Optional</span></div>
        <div class="bx-cover ${state.coverImage ? 'has' : ''}" id="cover-drop" tabindex="0" role="button" aria-label="Upload a cover image">
          ${state.coverImage ? `<img src="${esc(state.coverImage)}" alt="Cover" /><div class="bx-cover-over"><span>Change image</span></div>` : `<div class="bx-cover-empty"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><b>Drop an image here or click to upload</b><small>JPG, PNG or WebP. A wide photo works best.</small></div>`}
        </div>
        <div class="bx-row-between"><span class="bx-hint" id="cover-status"></span>
          <div class="bx-inline">${state.coverImage ? '<button type="button" class="bx-link danger" id="cover-remove">Remove</button>' : ''}<button type="button" class="bx-link" id="cover-url-toggle">Paste an image link instead</button></div></div>
        <input id="f-cover-url" class="bx-input" type="url" placeholder="https://…" value="${esc(state.coverImage || '')}" hidden />
      </div>
      <div class="bx-card">
        <div class="bx-card-head"><h3>Brand name on this scorecard</h3><span class="bx-opt">Optional</span></div>
        <input id="f-brand" class="bx-input" value="${esc(state.brandName || '')}" placeholder="${esc((USER && USER.business_name) || 'Your business name')}" />
        <small class="bx-hint">Leave blank to use your account name. Set it when you build for a client.</small>
      </div>`;
    $('#f-title').oninput = (e) => { state.title = e.target.value; $('#top-title').value = state.title; changed(); };
    $('#f-intro').oninput = (e) => { state.intro = e.target.value; changed(); };
    $$('[data-intro]').forEach(b => b.onclick = () => { state.intro = b.dataset.intro; $('#f-intro').value = state.intro; changed(); });
    $('#f-brand').oninput = (e) => { state.brandName = e.target.value; changed(); };
    const drop = $('#cover-drop'), input = $('#cover-upload-input');
    drop.onclick = () => input.click();
    drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) uploadCover(e.dataTransfer.files[0]); };
    input.onchange = () => { if (input.files[0]) uploadCover(input.files[0]); input.value = ''; };
    $('#cover-url-toggle').onclick = () => { const u = $('#f-cover-url'); u.hidden = !u.hidden; if (!u.hidden) u.focus(); };
    $('#f-cover-url').oninput = (e) => { state.coverImage = e.target.value.trim(); changed(); };
    $('#f-cover-url').onchange = () => drawEditor();
    const rm = $('#cover-remove'); if (rm) rm.onclick = () => { state.coverImage = ''; changed(); drawEditor(); };
  }
  async function uploadCover(file) {
    const st = $('#cover-status'); if (st) st.textContent = 'Uploading…';
    try {
      const form = new FormData(); form.append('cover', file);
      const res = await fetch('/api/scorecards/upload-cover', { method: 'POST', credentials: 'include', body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Upload failed.');
      state.coverImage = data.url; changed(); drawEditor();
      showToast('Cover image uploaded', 'success');
    } catch (err) { if ($('#cover-status')) $('#cover-status').textContent = ''; showToast(err.message || 'Upload failed.'); }
  }

  // 2. Questions and scoring
  function edQuestions(ed) {
    const cats = state.categories;
    ed.innerHTML = head('Questions & scoring', 'Write a question, add the answers, then tap how strong each answer is. Sieve adds it all up into a score.') + `
      <div class="bx-card">
        <div class="bx-card-head"><h3>What you're scoring</h3><span class="bx-hint" style="margin:0">These become the bars on each lead's result</span></div>
        <div class="bx-areas">
          ${cats.map((c, i) => `<span class="bx-area" style="--c:${TIER_COLORS[i % TIER_COLORS.length]}"><i></i><input value="${esc(c.label)}" data-cat="${i}" size="${Math.max(6, c.label.length)}" aria-label="Scoring area name" /><button type="button" data-rmcat="${i}" aria-label="Remove ${esc(c.label)}">×</button></span>`).join('')}
          <button type="button" class="bx-area-add" id="add-cat">+ Add</button>
        </div>
        <button type="button" class="bx-link" id="toggle-catmsg">${showCatMessages ? '− Hide' : '+ Write your own'} result messages for each area <span class="bx-opt">Optional</span></button>
        ${showCatMessages ? `<div class="bx-catmsgs">${cats.map((c, i) => `
          <div class="bx-catmsg"><b>${esc(c.label)}</b>
            <textarea rows="2" data-catlow="${i}" placeholder="If they score LOW on ${esc(c.label)}… (leave blank and Sieve writes it)">${esc(c.lowMessage || '')}</textarea>
            <textarea rows="2" data-cathigh="${i}" placeholder="If they score HIGH on ${esc(c.label)}… (leave blank and Sieve writes it)">${esc(c.highMessage || '')}</textarea></div>`).join('')}</div>` : ''}
      </div>
      <div class="bx-qlist">${state.questions.map((q, qi) => qCard(q, qi)).join('')}</div>
      <button type="button" class="bx-add-big" id="add-q"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add a question</button>`;
    // scoring areas
    $$('[data-cat]').forEach(inp => inp.oninput = (e) => { state.categories[+e.target.dataset.cat].label = e.target.value; e.target.size = Math.max(6, e.target.value.length); changed(); });
    $$('[data-cat]').forEach(inp => inp.onchange = () => drawEditor());
    $$('[data-rmcat]').forEach(b => b.onclick = async () => {
      if (state.categories.length <= 1) return showToast('A scorecard needs at least one scoring area.');
      const idx = +b.dataset.rmcat, c = state.categories[idx];
      if (!(await showConfirm(`Remove "${c.label}"? Its scores on every answer are removed too.`))) return;
      state.categories.splice(idx, 1);
      state.questions.forEach(q => q.options.forEach(o => { delete o.score[c.key]; }));
      changed(); drawEditor();
    });
    $('#add-cat').onclick = () => {
      const key = slugKey('category', state.categories.map(c => c.key));
      state.categories.push({ key, label: 'New area' });
      state.questions.forEach(q => q.options.forEach(o => { o.score[key] = 0; }));
      changed(); drawEditor();
      setTimeout(() => { const l = $$('[data-cat]').pop(); l && (l.focus(), l.select()); }, 20);
    };
    $('#toggle-catmsg').onclick = () => { showCatMessages = !showCatMessages; drawEditor(); };
    $$('[data-catlow]').forEach(t => t.oninput = (e) => { state.categories[+e.target.dataset.catlow].lowMessage = e.target.value; changed(); });
    $$('[data-cathigh]').forEach(t => t.oninput = (e) => { state.categories[+e.target.dataset.cathigh].highMessage = e.target.value; changed(); });
    // questions
    $('#add-q').onclick = () => {
      const score = {}; state.categories.forEach(c => { score[c.key] = 0; });
      state.questions.push({ text: '', options: ['Option A', 'Option B', 'Option C'].map(label => ({ label, score: { ...score } })) });
      openQ = state.questions.length - 1; changed(); drawEditor();
      setTimeout(() => { const t = $(`[data-qtext="${openQ}"]`); t && (t.focus(), t.scrollIntoView({ block: 'center', behavior: 'smooth' })); }, 30);
    };
    bindQuestions();
  }
  function scoreLevel(o) {
    const vals = state.categories.map(c => Number(o.score[c.key] || 0));
    const max = Math.max(0, ...vals);
    return max >= 8 ? 'strong' : max >= 4 ? 'medium' : 'weak';
  }
  function qCard(q, qi) {
    const open = qi === openQ;
    return `<div class="bx-q ${open ? 'open' : ''}" data-qcard="${qi}">
      <div class="bx-q-head" data-qopen="${qi}">
        <span class="bx-q-n">${qi + 1}</span>
        <div class="bx-q-sum"><b>${esc(q.text) || '<em>Untitled question</em>'}</b><small>${q.options.length} answers${open ? '' : ' · ' + q.options.map(o => `<i class="lv ${scoreLevel(o)}"></i>`).join('')}</small></div>
        <div class="bx-q-tools">
          <button type="button" data-qup="${qi}" title="Move up" ${qi === 0 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
          <button type="button" data-qdown="${qi}" title="Move down" ${qi === state.questions.length - 1 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          <button type="button" data-qdup="${qi}" title="Duplicate"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg></button>
          <button type="button" data-qdel="${qi}" title="Delete" class="danger"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
        </div>
      </div>
      ${open ? `<div class="bx-q-body">
        <textarea class="bx-q-text" data-qtext="${qi}" rows="2" placeholder="Type your question, e.g. What's your budget for this project?">${esc(q.text)}</textarea>
        <div class="bx-ans-head"><span>Answers</span><span class="bx-hint" style="margin:0">Tap how strong each answer is${state.categories.length > 1 ? ', or fine-tune each area' : ''}</span></div>
        ${q.options.map((o, oi) => optRow(o, qi, oi)).join('')}
        <button type="button" class="bx-add-small" data-addopt="${qi}">+ Add an answer</button>
      </div>` : ''}
    </div>`;
  }
  function optRow(o, qi, oi) {
    const lv = scoreLevel(o), k = `${qi}:${oi}`;
    const insightOpen = openInsight.has(k) || (o.insight && o.insight.trim());
    return `<div class="bx-opt-row lv-${lv}">
      <div class="bx-opt-top">
        <span class="bx-letter">${LETTERS[oi] || oi + 1}</span>
        <input class="bx-opt-label" data-olabel="${k}" value="${esc(o.label)}" placeholder="Answer text" />
        <div class="bx-strength" role="group" aria-label="How strong is this answer">
          ${[['strong', 'Strong', 10], ['medium', 'Medium', 5], ['weak', 'Weak', 0]].map(([v, l, n]) => `<button type="button" class="${lv === v ? 'on' : ''} s-${v}" data-lv="${k}:${n}" aria-pressed="${lv === v}">${l}</button>`).join('')}
        </div>
        <button type="button" class="bx-x" data-odel="${k}" title="Remove answer" aria-label="Remove answer">×</button>
      </div>
      ${state.categories.length ? `<div class="bx-sliders">${state.categories.map((c, ci) => {
        const v = Number(o.score[c.key] || 0);
        return `<label class="bx-slider" style="--c:${TIER_COLORS[ci % TIER_COLORS.length]};--p:${v * 10}%"><span>${esc(c.label)}</span><input type="range" min="0" max="10" step="1" value="${v}" data-oscore="${k}:${c.key}" /><b>${v}</b></label>`; }).join('')}</div>` : ''}
      ${insightOpen ? `<textarea class="bx-insight" rows="2" data-oinsight="${k}" placeholder="What should someone who picks this answer read? (leave blank and Sieve writes it)">${esc(o.insight || '')}</textarea>`
        : `<button type="button" class="bx-link small" data-oinsight-open="${k}">+ Write your own tip for this answer</button>`}
    </div>`;
  }
  function bindQuestions() {
    const qs = state.questions;
    $$('[data-qopen]').forEach(h => h.onclick = (e) => { if (e.target.closest('.bx-q-tools')) return; const i = +h.dataset.qopen; openQ = openQ === i ? -1 : i; drawEditor(); drawPreview(); });
    $$('[data-qtext]').forEach(t => t.oninput = (e) => { qs[+e.target.dataset.qtext].text = e.target.value; const s = e.target.closest('.bx-q').querySelector('.bx-q-sum b'); s.textContent = e.target.value || 'Untitled question'; changed(); });
    $$('[data-qup]').forEach(b => b.onclick = () => { const i = +b.dataset.qup; [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]]; if (openQ === i) openQ = i - 1; changed(); drawEditor(); });
    $$('[data-qdown]').forEach(b => b.onclick = () => { const i = +b.dataset.qdown; [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]]; if (openQ === i) openQ = i + 1; changed(); drawEditor(); });
    $$('[data-qdup]').forEach(b => b.onclick = () => { const i = +b.dataset.qdup; qs.splice(i + 1, 0, JSON.parse(JSON.stringify(qs[i]))); openQ = i + 1; changed(); drawEditor(); showToast('Question duplicated', 'success'); });
    $$('[data-qdel]').forEach(b => b.onclick = async () => {
      const i = +b.dataset.qdel;
      if (!(await showConfirm(`Delete question ${i + 1}${qs[i].text ? ` ("${qs[i].text.slice(0, 60)}")` : ''}?`))) return;
      qs.splice(i, 1); if (openQ >= qs.length) openQ = qs.length - 1; changed(); drawEditor();
    });
    $$('[data-olabel]').forEach(inp => inp.oninput = (e) => { const [qi, oi] = e.target.dataset.olabel.split(':').map(Number); qs[qi].options[oi].label = e.target.value; changed(); });
    $$('[data-lv]').forEach(b => b.onclick = () => {
      const [qi, oi, n] = b.dataset.lv.split(':').map(Number), o = qs[qi].options[oi];
      // one tap scores the answer in the areas this question measures (any area another answer here scores in);
      // a brand-new question measures every area. The sliders below can fine-tune each one.
      const measured = state.categories.filter(c => qs[qi].options.some(x => Number(x.score[c.key] || 0) > 0));
      (measured.length ? measured : state.categories).forEach(c => { o.score[c.key] = n; });
      changed(); drawEditor();
    });
    $$('[data-oscore]').forEach(r => r.oninput = (e) => {
      const [qi, oi, key] = e.target.dataset.oscore.split(':'); const v = Number(e.target.value) || 0;
      qs[+qi].options[+oi].score[key] = v;
      const lab = e.target.closest('.bx-slider'); lab.style.setProperty('--p', v * 10 + '%'); lab.querySelector('b').textContent = v;
      const row = e.target.closest('.bx-opt-row'), lv = scoreLevel(qs[+qi].options[+oi]);
      row.className = 'bx-opt-row lv-' + lv; $$('.bx-strength button', row).forEach(x => { const on = x.classList.contains('s-' + lv); x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
      changed();
    });
    $$('[data-odel]').forEach(b => b.onclick = () => { const [qi, oi] = b.dataset.odel.split(':').map(Number); if (qs[qi].options.length <= 2) return showToast('A question needs at least two answers.'); qs[qi].options.splice(oi, 1); changed(); drawEditor(); });
    $$('[data-addopt]').forEach(b => b.onclick = () => {
      const qi = +b.dataset.addopt, score = {}; state.categories.forEach(c => { score[c.key] = 0; });
      qs[qi].options.push({ label: '', score }); changed(); drawEditor();
      setTimeout(() => { const l = $$(`[data-olabel^="${qi}:"]`).pop(); l && l.focus(); }, 20);
    });
    $$('[data-oinsight-open]').forEach(b => b.onclick = () => { openInsight.add(b.dataset.oinsightOpen); drawEditor(); setTimeout(() => { const t = $(`[data-oinsight="${b.dataset.oinsightOpen}"]`); t && t.focus(); }, 20); });
    $$('[data-oinsight]').forEach(t => t.oninput = (e) => { const [qi, oi] = e.target.dataset.oinsight.split(':').map(Number); qs[qi].options[oi].insight = e.target.value; changed(); });
  }

  // 3. Results
  function edResults(ed) {
    ed.innerHTML = head('Results', 'Sieve writes every lead a personal result from their score. Add a button so your best leads can take the next step.') + `
      <div class="bx-tiers">${state.tiers.map((t, i) => `
        <div class="bx-tier ${pvTier === i ? 'sel' : ''}" style="--c:${TIER_COLORS[i % TIER_COLORS.length]}" data-tier="${i}">
          <div class="bx-tier-head">
            <span class="bx-tier-dot"></span>
            <div><b>${esc(t.label)}</b><small>Scores ${tierRange(i)}</small></div>
            <span class="bx-tier-state">${t.recommendationUrl ? '✓ Has a button' : i === 0 ? 'Add a button' : 'Auto-written'}</span>
          </div>
          <div class="bx-tier-body">
            <div class="bx-two">
              <label class="bx-field"><span>Button text</span><input data-tlabel="${i}" value="${esc(t.recommendationLabel || '')}" placeholder="Book Now" /></label>
              <label class="bx-field"><span>Button link</span><input type="url" data-turl="${i}" value="${esc(t.recommendationUrl || '')}" placeholder="https://wa.me/234… or your booking page" /></label>
            </div>
            <div class="bx-chips">${['Book a free call', 'Chat on WhatsApp', 'See our packages', 'Get a quote'].map(x => `<button type="button" class="bx-chip" data-tquick="${i}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
            <label class="bx-field"><span>Line above the button</span><textarea rows="2" data-trec="${i}" placeholder="e.g. Let's talk through what this means for you and map out your next move.">${esc(t.recommendation || '')}</textarea></label>
            <details class="bx-more" ${t.headline || t.message ? 'open' : ''}><summary>Write your own headline and message <span class="bx-opt">Optional</span></summary>
              <label class="bx-field"><span>Headline</span><input data-thead="${i}" value="${esc(t.headline || '')}" placeholder="Leave blank and Sieve writes it from their score" /></label>
              <label class="bx-field"><span>Message</span><textarea rows="3" data-tmsg="${i}" placeholder="Leave blank and Sieve writes it from their score">${esc(t.message || '')}</textarea></label>
            </details>
          </div>
        </div>`).join('')}</div>
      <p class="bx-hint">No link? The button just won't show for that group. Everything else on their result is written for them automatically.</p>`;
    const T = state.tiers;
    $$('[data-tier]').forEach(c => c.addEventListener('focusin', () => { if (pvTier !== +c.dataset.tier) { pvTier = +c.dataset.tier; $$('[data-tier]').forEach(x => x.classList.toggle('sel', +x.dataset.tier === pvTier)); drawPreview(); } }));
    $$('[data-tier]').forEach(c => c.addEventListener('click', () => { if (pvTier !== +c.dataset.tier) { pvTier = +c.dataset.tier; $$('[data-tier]').forEach(x => x.classList.toggle('sel', +x.dataset.tier === pvTier)); drawPreview(); } }));
    const bind = (attr, key) => $$(`[data-${attr}]`).forEach(el => el.oninput = (e) => { T[+e.target.dataset[attr]][key] = e.target.value; changed(); });
    bind('tlabel', 'recommendationLabel'); bind('turl', 'recommendationUrl'); bind('trec', 'recommendation'); bind('thead', 'headline'); bind('tmsg', 'message');
    $$('[data-turl]').forEach(el => el.onchange = () => { const v = el.value.trim(); if (v && !/^https?:\/\//i.test(v)) { el.value = 'https://' + v; T[+el.dataset.turl].recommendationUrl = el.value; changed(); } edResults(ed); });
    $$('[data-tquick]').forEach(b => b.onclick = () => { const i = +b.dataset.tquick; T[i].recommendationLabel = b.dataset.v; $(`[data-tlabel="${i}"]`).value = b.dataset.v; changed(); });
  }

  // 4. Extras
  function edExtras(ed) {
    const pc = state.profileCapture || (state.profileCapture = {});
    const fields = [['captureAge', 'Age range'], ['captureGender', 'Gender'], ['captureLocation', 'State (location)'], ['captureSocialClass', 'Income bracket']];
    ed.innerHTML = head('Extras', 'Both are off by default. Turn one on only when a campaign needs it.') + `
      <div class="bx-card bx-switch-card ${pc.enabled ? 'on' : ''}">
        <div class="bx-switch-head">
          <div><h3>Audience insights <span class="section-tag">Signal Desk</span></h3><p class="bx-hint" style="margin:4px 0 0">Ask a few profile questions for a brand-sponsored campaign. Powers the Brand Campaign Insight Report.</p></div>
          <label class="bx-switch"><input type="checkbox" id="pc-enabled" ${pc.enabled ? 'checked' : ''} /><span></span></label>
        </div>
        ${pc.enabled ? `<div class="bx-switch-body">
          <div class="bx-sub">What to ask</div>
          <div class="bx-chips">${fields.map(([k, l]) => `<button type="button" class="bx-chip toggle ${pc[k] ? 'on' : ''}" data-pc="${k}" aria-pressed="${!!pc[k]}">${pc[k] ? '✓ ' : '+ '}${l}</button>`).join('')}</div>
          <label class="bx-field" style="margin-top:14px"><span>Interest question <span class="bx-opt">Optional</span></span><input id="pc-interest-q" value="${esc(pc.interestQuestion || '')}" placeholder="e.g. Which best describes your interest in [Brand]?" /></label>
          <div class="bx-field"><span>Answer choices</span>
            <div class="bx-tags" id="pc-tags">${(pc.interestOptions || []).map((t, i) => `<span class="bx-tag">${esc(t)}<button type="button" data-rmtag="${i}" aria-label="Remove ${esc(t)}">×</button></span>`).join('')}<input id="pc-tag-in" placeholder="${(pc.interestOptions || []).length ? 'Add another…' : 'Type a choice and press Enter'}" /></div></div>
        </div>` : ''}
      </div>
      <div class="bx-card bx-switch-card ${state.engagementMode ? 'on' : ''}">
        <div class="bx-switch-head">
          <div><h3>Engagement campaign <span class="section-tag">Engagement</span></h3><p class="bx-hint" style="margin:4px 0 0">Shows leads their completion time and a shareable result, and adds time-spent stats to your report.</p></div>
          <label class="bx-switch"><input type="checkbox" id="engagement-mode" ${state.engagementMode ? 'checked' : ''} /><span></span></label>
        </div>
        ${state.engagementMode ? `<div class="bx-switch-body">
          <label class="bx-field"><span>Share message leads can post <span class="bx-opt">Optional</span></span>
            <textarea id="share-template" rows="2" placeholder="I scored {score}% on {title}! Check yours: {link}">${esc(state.shareTemplate || '')}</textarea></label>
          <div class="bx-chips"><span class="bx-hint" style="margin:0 4px 0 0">Insert:</span>${['{score}', '{title}', '{brand}', '{tier}', '{link}'].map(t => `<button type="button" class="bx-chip mono" data-token="${t}">${t}</button>`).join('')}</div>
        </div>` : ''}
      </div>`;
    $('#pc-enabled').onchange = (e) => { pc.enabled = e.target.checked; changed(); drawEditor(); };
    $$('[data-pc]').forEach(b => b.onclick = () => { pc[b.dataset.pc] = !pc[b.dataset.pc]; changed(); drawEditor(); });
    const iq = $('#pc-interest-q'); if (iq) iq.oninput = (e) => { pc.interestQuestion = e.target.value; changed(); };
    const ti = $('#pc-tag-in');
    if (ti) {
      ti.onkeydown = (e) => {
        if ((e.key === 'Enter' || e.key === ',') && ti.value.trim()) { e.preventDefault(); (pc.interestOptions ||= []).push(ti.value.trim().replace(/,$/, '')); changed(); drawEditor(); setTimeout(() => $('#pc-tag-in')?.focus(), 10); }
        else if (e.key === 'Backspace' && !ti.value && (pc.interestOptions || []).length) { pc.interestOptions.pop(); changed(); drawEditor(); setTimeout(() => $('#pc-tag-in')?.focus(), 10); }
      };
      ti.onblur = () => { if (ti.value.trim()) { (pc.interestOptions ||= []).push(ti.value.trim()); changed(); drawEditor(); } };
    }
    $$('[data-rmtag]').forEach(b => b.onclick = () => { pc.interestOptions.splice(+b.dataset.rmtag, 1); changed(); drawEditor(); });
    $('#engagement-mode').onchange = (e) => { state.engagementMode = e.target.checked; changed(); drawEditor(); };
    const st = $('#share-template'); if (st) st.oninput = (e) => { state.shareTemplate = e.target.value; changed(); };
    $$('[data-token]').forEach(b => b.onclick = () => { const t = $('#share-template'), s = t.selectionStart ?? t.value.length; t.value = t.value.slice(0, s) + b.dataset.token + t.value.slice(t.selectionEnd ?? s); state.shareTemplate = t.value; t.focus(); t.selectionStart = t.selectionEnd = s + b.dataset.token.length; changed(); });
  }

  // 5. Publish and share
  function checks() {
    return [
      ['Give it a title', !!state.title.trim(), 'page'],
      ['Write a short intro', !!state.intro.trim(), 'page'],
      ['Add at least one question', state.questions.length > 0, 'questions'],
      ['Every question has text and 2+ answers', state.questions.length > 0 && state.questions.every(q => q.text.trim() && q.options.length >= 2 && q.options.every(o => o.label.trim())), 'questions'],
      ['Add a button for your best leads', !!state.tiers[0]?.recommendationUrl, 'results', true],
    ];
  }
  function edShare(ed) {
    const list = checks(), blocking = list.filter(c => !c[1] && !c[3]);
    if (!state.published) {
      ed.innerHTML = head('Publish & share', 'Go live to get a link you can send on WhatsApp, post in your bio or print as a QR code.') + `
        <div class="bx-card">
          <div class="bx-card-head"><h3>Before you go live</h3><span class="bx-hint" style="margin:0">${list.filter(c => c[1]).length} of ${list.length} done</span></div>
          <div class="bx-checks">${list.map(([t, ok, s, opt]) => `<button type="button" class="bx-check ${ok ? 'ok' : ''}" data-fix="${s}"><span class="bx-tick">${ok ? '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : ''}</span><span>${t}${opt ? ' <span class="bx-opt">Recommended</span>' : ''}</span>${ok ? '' : '<b>Fix →</b>'}</button>`).join('')}</div>
        </div>
        <div class="bx-golive">
          <div><h3>${blocking.length ? 'Almost there' : 'Ready to go live'}</h3><p>${blocking.length ? 'Finish the steps above to publish.' : 'Anyone with the link can take it. You can unpublish any time.'}</p></div>
          <button class="btn btn-accent bx-big" id="publish-btn" ${blocking.length ? 'disabled' : ''}>Publish scorecard</button>
        </div>`;
      $$('[data-fix]').forEach(b => b.onclick = () => go(b.dataset.fix));
      const pb = $('#publish-btn'); if (pb) pb.onclick = () => togglePublish(true);
      return;
    }
    const url = liveUrl(), title = state.title;
    const wa = `Hi! ${title} — take this quick assessment from ${(state.brandName && state.brandName.trim()) || 'us'} and get your results instantly: ${url}`;
    const embed = `<iframe src="${url}&embed=1" style="width:100%;max-width:520px;height:640px;border:0;" title="${title.replace(/"/g, '&quot;')}"></iframe>`;
    ed.innerHTML = head('Your scorecard is live 🎉', 'Share the link anywhere your customers are. New leads appear in your dashboard, already scored.') + `
      <div class="bx-card bx-livebox">
        <div class="bx-sub">Your link</div>
        <div class="bx-copy"><input id="share-link" value="${esc(url)}" readonly /><button class="btn btn-primary btn-sm" data-copy="share-link">Copy</button></div>
        <div class="bx-share-grid">
          <a class="bx-share wa" href="https://wa.me/?text=${encodeURIComponent(wa)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A9 9 0 1 1 8 20z"/><path d="M8.5 9.5c.5 2.5 2.5 4.5 5 5l1.2-1.2 2 1-.5 1.7c-3.6.4-8.6-4.6-8.2-8.2l1.7-.5 1 2z"/></svg>Share on WhatsApp</a>
          <a class="bx-share" href="${esc(url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Open live page</a>
          <a class="bx-share" href="/report.html?id=${scorecardId}"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>View report</a>
          <a class="bx-share" href="/leads.html?id=${scorecardId}"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>See leads</a>
        </div>
      </div>
      <div class="bx-two-cards">
        <div class="bx-card"><div class="bx-sub">WhatsApp Status, groups or broadcast</div>
          <textarea id="whatsapp-broadcast-text" class="bx-readonly" rows="4" readonly>${esc(wa)}</textarea>
          <button class="btn btn-ghost btn-sm" data-copy="whatsapp-broadcast-text">Copy message</button></div>
        <div class="bx-card bx-qr"><div class="bx-sub">QR code for flyers and posters</div>
          <img id="qr-image" src="/api/scorecards/${scorecardId}/qr.png" alt="QR code linking to this scorecard" width="140" height="140" />
          <a class="btn btn-ghost btn-sm" href="/api/scorecards/${scorecardId}/qr.png" download>Download QR</a></div>
      </div>
      <details class="bx-card bx-more"><summary>Embed on your website</summary>
        <div class="bx-copy" style="margin-top:12px"><input id="embed-code" value="${esc(embed)}" readonly /><button class="btn btn-ghost btn-sm" data-copy="embed-code">Copy</button></div></details>
      <div class="bx-unpub"><span>Need to make big changes? Unpublishing stops new leads until you publish again.</span><button class="bx-link danger" id="unpublish">Unpublish</button></div>`;
    $$('[data-copy]').forEach(b => b.onclick = async () => { const el = $('#' + b.dataset.copy); try { await navigator.clipboard.writeText(el.value); } catch { el.select(); document.execCommand('copy'); } showToast('Copied', 'success'); });
    $('#unpublish').onclick = async () => { if (await showConfirm('Unpublish this scorecard? The link stops accepting new leads until you publish again.')) togglePublish(false); };
  }
  async function togglePublish(on) {
    try {
      await save();
      const { scorecard: updated } = await api(`/scorecards/${scorecardId}/publish`, { method: 'POST', body: { published: on } });
      state.published = updated.published; state.slug = updated.slug;
      if (on) showToast('Your scorecard is live', 'success');
      step = 'share'; history.replaceState(null, '', '#share'); drawAll();
    } catch (ex) { showToast(ex.message || 'Could not change the publish status.'); }
  }

  /* ---------- live preview ---------- */
  let pvFrame = null;
  function drawPreview() { cancelAnimationFrame(pvFrame); pvFrame = requestAnimationFrame(paintPreview); }
  function paintPreview() {
    const pv = $('#pv'), b = esc(brand());
    const cap = { page: 'Landing page', questions: 'A question', results: 'A result', extras: 'Profile questions', share: 'Landing page' }[step];
    $('#pv-caption').textContent = cap;
    const n = state.questions.length;
    if (step === 'questions' && n) {
      const qi = Math.max(0, Math.min(openQ < 0 ? 0 : openQ, n - 1)), q = state.questions[qi];
      pv.innerHTML = `<div class="pv-pad"><div class="pv-brand">${b}</div>
        <div class="pv-prog"><i style="width:${Math.round(((qi + 1) / n) * 100)}%"></i></div><div class="pv-count">Question ${qi + 1} of ${n}</div>
        <h4 class="pv-q">${esc(q.text) || 'Your question appears here'}</h4>
        ${q.options.map((o, oi) => `<div class="pv-opt"><span>${LETTERS[oi]}</span>${esc(o.label) || '&nbsp;'}</div>`).join('')}</div>`;
      return;
    }
    if (step === 'results' && state.tiers.length) {
      const t = state.tiers[pvTier] || state.tiers[0], hi = pvTier > 0 ? state.tiers[pvTier - 1].min - 1 : 100;
      const score = Math.round((t.min + hi) / 2), color = TIER_COLORS[pvTier % TIER_COLORS.length];
      pv.innerHTML = `<div class="pv-pad"><div class="pv-brand">${b}</div>
        <div class="pv-score" style="--c:${color};--p:${score}"><div><b>${score}%</b><small>your score</small></div></div>
        <div class="pv-tier" style="color:${color}">${esc(t.label)}</div>
        <h4 class="pv-head">${esc(t.headline) || `You're ${score >= 70 ? 'in a strong position' : score >= 40 ? 'on your way' : 'just getting started'}`}</h4>
        <p class="pv-msg">${esc(t.message) || 'A short personal message, written by Sieve from their answers.'}</p>
        ${state.categories.map((c, i) => { const v = Math.max(8, Math.min(100, score + (i % 2 ? -12 : 9) * (i + 1) / 2)); return `<div class="pv-bar"><span>${esc(c.label)}</span><div><i style="width:${v}%;background:${TIER_COLORS[i % TIER_COLORS.length]}"></i></div></div>`; }).join('')}
        ${t.recommendationUrl ? `<div class="pv-cta">${t.recommendation ? `<p>${esc(t.recommendation)}</p>` : ''}<span>${esc(t.recommendationLabel || 'Book Now')}</span></div>` : '<div class="pv-nocta">No button for this group yet</div>'}</div>`;
      return;
    }
    if (step === 'extras' && state.profileCapture?.enabled) {
      const pc = state.profileCapture;
      const rows = [pc.captureAge && 'Age range', pc.captureGender && 'Gender', pc.captureLocation && 'State', pc.captureSocialClass && 'Income bracket'].filter(Boolean);
      pv.innerHTML = `<div class="pv-pad"><div class="pv-brand">${b}</div><h4 class="pv-q">A little about you</h4>
        ${rows.map(r => `<div class="pv-field"><span>${r}</span><i>Select ▾</i></div>`).join('') || '<p class="pv-msg">Tap the profile questions you want to ask.</p>'}
        ${pc.interestQuestion ? `<div class="pv-sub">${esc(pc.interestQuestion)}</div>${(pc.interestOptions || []).map(o => `<div class="pv-opt small">${esc(o)}</div>`).join('')}` : ''}</div>`;
      return;
    }
    // landing page
    pv.innerHTML = `${state.coverImage ? `<div class="pv-cover" style="background-image:url('${esc(state.coverImage)}')"></div>` : '<div class="pv-cover empty"></div>'}
      <div class="pv-pad"><div class="pv-brand">${b}</div>
        <h3 class="pv-title">${esc(state.title) || 'Your scorecard title'}</h3>
        <p class="pv-intro">${esc(state.intro) || 'Your intro appears here.'}</p>
        <div class="pv-meta"><span>⏱ ${Math.max(1, Math.round(n * 0.25))} min</span><span>${n} question${n === 1 ? '' : 's'}</span><span>Free</span></div>
        <div class="pv-start">Start the scorecard →</div></div>`;
  }

  /* ---------- top bar and mobile preview ---------- */
  $('#top-title').oninput = (e) => { state.title = e.target.value; const f = $('#f-title'); if (f) f.value = state.title; changed(); };
  $('#publish-top').onclick = () => { if (state.published) go('share'); else { go('share'); } };
  $('#preview-btn').onclick = async () => {
    const win = window.open('', '_blank');
    await save();
    if (win) win.location.href = `/take/index.html?slug=${state.slug}&preview=1`;
  };
  window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (STEPS.some(s => s.key === k) && k !== step) go(k); });
  $('#pv-fab').onclick = () => document.body.classList.add('pv-open');
  $('#pv-close').onclick = () => document.body.classList.remove('pv-open');

  (async () => {
    USER = await requireUser();
    if (!USER) return;
    const { scorecard } = await api(`/scorecards/${scorecardId}`);
    state = scorecard;
    state.profileCapture ||= { enabled: false, interestOptions: [] };
    if (!state.categories.length) state.categories = [{ key: 'fit', label: 'Fit' }];
    if (!state.questions.length) openQ = -1;
    drawAll();
    setStatus('saved', 'All changes saved');
  })();
  </script>
</body>
</html>
