<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorecard Builder — Sieve</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/logo.png" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/app.css" />
<link rel="stylesheet" href="/builder.css" />
</head>
<body class="sb">
  <!-- top bar -->
  <header class="sb-top">
    <a href="/dashboard.html" class="sb-back" title="Back to your scorecards" aria-label="Back to your scorecards"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <img src="/logo.png" class="sb-logo" alt="Sieve" />
    <div class="sb-name">
      <input id="top-title" placeholder="Untitled scorecard" aria-label="Scorecard name" />
      <span class="sb-save" id="save-status"><i></i><span>All changes saved</span></span>
    </div>
    <span class="sb-state" id="state-pill">Draft</span>
    <div class="sb-top-actions">
      <button class="sb-btn ghost" id="preview-btn" title="Open the real page in a new tab"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Preview</span></button>
      <button class="sb-btn primary" id="publish-top">Publish</button>
    </div>
  </header>

  <div class="sb-body">
    <!-- 1. areas -->
    <nav class="sb-rail" id="rail" aria-label="Builder areas"></nav>
    <!-- 2. outline for the area (questions list, tiers…) -->
    <aside class="sb-sub" id="sub"></aside>
    <!-- 3. the page itself: click any text to edit it -->
    <main class="sb-canvas-wrap">
      <div class="sb-canvas-bar" id="canvas-bar"></div>
      <div class="sb-canvas" id="canvas"></div>
    </main>
    <!-- 4. settings for whatever is selected -->
    <aside class="sb-panel" id="panel"></aside>
  </div>
  <input type="file" id="cover-upload-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden />

  <script src="/app.js"></script>
  <script src="/question-coach.js"></script>
  <script>
  // Sieve builder, laid out like the best quiz builders: areas on the left, the page itself in the middle
  // (click any text on it to edit), and settings for the selected item on the right.
  // Server calls are unchanged: GET/PUT /api/scorecards/:id, POST /:id/publish, POST /upload-cover, GET /:id/qr.png.
  const params = new URLSearchParams(location.search);
  const scorecardId = params.get('id');
  if (!scorecardId) window.location.href = '/dashboard.html';

  let state = { title: '', intro: '', categories: [], questions: [], tiers: [], slug: '', published: false, profileCapture: { enabled: false, interestOptions: [] }, engagementMode: false, shareTemplate: '' };
  let USER = null;
  const AREAS = [
    { key: 'questions', label: 'Questions', icon: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/>' },
    { key: 'landing', label: 'Landing', icon: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 13h6M7 16h4"/>' },
    { key: 'results', label: 'Results', icon: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>' },
    { key: 'settings', label: 'Settings', icon: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>' },
    { key: 'share', label: 'Share', icon: '<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/>' },
  ];
  let AREA = (AREAS.find(a => a.key === location.hash.slice(1)) || AREAS[0]).key;
  let SEL = { type: 'q', i: 0 };        // what the right panel is editing
  let TIER = 0;                         // which result tier the results page shows
  let DEVICE = 'desktop';
  const openTips = new Set();
  const activeCats = {};                // per question: categories switched on before any points exist (UI only)

  const COLORS = ['#3B5BFD', '#12A4D9', '#7C5CFF', '#0E9F6E', '#E08A0B', '#E5487D'];
  const TIER_COLORS = ['#0E9F6E', '#E08A0B', '#3B5BFD', '#7D879F', '#7C3AED'];
  const LETTERS = 'ABCDEFGHIJKLMNOP';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const brand = () => (state.brandName && state.brandName.trim()) || (USER && USER.business_name) || 'Your business';
  const liveUrl = () => `${location.origin}/take/index.html?slug=${state.slug}`;
  const svg = (p) => `<svg viewBox="0 0 24 24">${p}</svg>`;
  const I = {
    plus: '<path d="M12 5v14M5 12h14"/>', drag: '<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    up: '<path d="M18 15l-6-6-6 6"/>', down: '<path d="M6 9l6 6 6-6"/>', desk: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>', phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    img: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>', home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', wand: '<path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8L19 13M17.8 6.2L19 5M3 21l9-9M12.2 6.2L11 5"/>',
  };
  function slugKey(text, existing) { let base = text.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/(^_|_$)/g, '') || 'cat'; let key = base, n = 1; while (existing.includes(key)) { n += 1; key = `${base}${n}`; } return key; }
  const sortedTiers = () => state.tiers.map((t, i) => ({ t, i })).sort((a, b) => b.t.min - a.t.min);
  const tierMax = (i) => { const s = sortedTiers(), pos = s.findIndex(x => x.i === i); return pos > 0 ? s[pos - 1].t.min - 1 : 100; };
  const catColor = (key) => COLORS[Math.max(0, state.categories.findIndex(c => c.key === key)) % COLORS.length];
  const qCats = (qi) => { const q = state.questions[qi]; if (!q || q.kind === 'about') return []; const on = new Set(activeCats[qi] || []); (q.cats || []).forEach(k => on.add(k)); state.categories.forEach(c => { if ((q.options || []).some(o => Number(o.score?.[c.key] || 0) !== 0)) on.add(c.key); }); return state.categories.filter(c => on.has(c.key)); };
  const isAboutQ = (q) => q && q.kind === 'about';
  const isTextQ = (q) => isAboutQ(q) && q.format === 'text';
  const isGenQ = (q) => q && !isAboutQ(q) && (q.format === 'yesno' || q.format === 'scale');
  const qValid = (q) => q.text.trim() && (isTextQ(q) || (q.options.length >= 2 && q.options.every(o => String(o.label || '').trim())));
  // yes/no and scale questions build their own options from their settings
  function regen(qi) { const q = state.questions[qi]; if (!isGenQ(q)) return; q.cats = qCats(qi).map(c => c.key); if (!q.cats.length && state.categories[0]) q.cats = [state.categories[0].key]; q.points = SieveQ.clampPoints(q.points); q.options = SieveQ.buildOptions(q); }

  /* ---------- autosave ---------- */
  let saveTimer = null, saving = false, dirty = false, saveAgain = false;
  function setStatus(kind, text) { const el = $('#save-status'); el.className = 'sb-save ' + kind; el.querySelector('span').textContent = text; }
  function changed() { dirty = true; setStatus('dirty', 'Saving soon…'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 1000); }
  async function save() {
    clearTimeout(saveTimer);
    if (saving) { saveAgain = true; return; }
    if (!state.questions.length || state.questions.some(q => !q.text.trim() || (!isTextQ(q) && q.options.length < 2))) { setStatus('dirty', 'Every question needs text and 2 answers to save'); return; }
    saving = true; setStatus('saving', 'Saving…');
    try {
      const { scorecard } = await api(`/scorecards/${scorecardId}`, { method: 'PUT', body: {
        title: state.title, intro: state.intro, categories: state.categories, questions: state.questions, tiers: state.tiers,
        brandName: state.brandName, coverImage: state.coverImage, profileCapture: state.profileCapture, engagementMode: state.engagementMode, shareTemplate: state.shareTemplate } });
      state.slug = scorecard.slug; state.published = scorecard.published;
      dirty = false; setStatus('saved', 'All changes saved');
    } catch (ex) { setStatus('error', 'Not saved, retrying'); showToast(ex.message); clearTimeout(saveTimer); saveTimer = setTimeout(save, 4000); }
    finally { saving = false; if (saveAgain) { saveAgain = false; save(); } }
  }
  window.addEventListener('beforeunload', (e) => { if (dirty) { save(); e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } });

  /* ---------- drawing ---------- */
  function go(area, sel) { AREA = area; if (sel) SEL = sel; else SEL = area === 'questions' ? { type: 'q', i: Math.max(0, Math.min(SEL.type === 'q' ? SEL.i : 0, state.questions.length - 1)) } : area === 'results' ? { type: 'tier', i: TIER } : area === 'landing' ? { type: 'landing' } : { type: area }; history.replaceState(null, '', '#' + area); drawAll(); }
  function drawAll() { drawTop(); drawRail(); drawSub(); drawCanvas(); drawPanel(); }
  function drawTop() {
    if (document.activeElement !== $('#top-title')) $('#top-title').value = state.title;
    const pill = $('#state-pill'); pill.textContent = state.published ? '● Live' : 'Draft'; pill.className = 'sb-state ' + (state.published ? 'live' : '');
    const pt = $('#publish-top'); pt.textContent = state.published ? 'Share' : 'Publish'; pt.className = 'sb-btn ' + (state.published ? 'ghost' : 'primary');
  }
  function drawRail() {
    $('#rail').innerHTML = AREAS.map(a => `<button class="${a.key === AREA ? 'on' : ''}" data-area="${a.key}" title="${a.label}">${svg(a.icon)}<span>${a.label}</span></button>`).join('');
    $$('[data-area]', $('#rail')).forEach(b => b.onclick = () => go(b.dataset.area));
  }

  // the outline column
  function drawSub() {
    const el = $('#sub');
    document.body.classList.toggle('no-sub', !['questions', 'results'].includes(AREA));
    if (AREA === 'questions') {
      el.innerHTML = `
        <div class="sb-sub-head"><b>Lead journey</b></div>
        <button class="sb-flow ${SEL.type === 'landing' ? 'on' : ''}" data-golanding>${svg(I.home)}<span>Landing page</span></button>
        <div class="sb-sub-head"><b>Questions</b><span>${state.questions.length}</span></div>
        <div class="sb-outline" id="outline">${state.questions.map((q, i) => `
          <div class="sb-oq ${SEL.type === 'q' && SEL.i === i ? 'on' : ''}" draggable="true" data-oq="${i}">
            <span class="sb-grip" title="Drag to reorder">${svg(I.drag)}</span><span class="sb-on">${i + 1}</span>
            <span class="sb-ot">${esc(q.text) || '<em>New question</em>'}</span>
            <span class="sb-odots">${isAboutQ(q) ? '<em class="sb-about-tag" title="About you, not scored">About</em>' : ''}${qCats(i).map(c => `<i style="background:${catColor(c.key)}" title="${esc(c.label)}"></i>`).join('')}</span>
          </div>`).join('')}</div>
        <button class="sb-add" id="add-q">${svg(I.plus)}Add question</button>
        <div class="sb-flow muted">${svg(I.user)}<span>Lead details<small>Name, phone, email</small></span></div>
        <button class="sb-flow" data-goresults>${svg(I.flag)}<span>Result page</span></button>
        <div class="sb-sub-head" style="margin-top:14px"><b>Categories</b><span>${state.categories.length}</span></div>
        <div class="sb-cats">${state.categories.map((c, i) => `<button class="sb-cat ${SEL.type === 'cat' && SEL.i === i ? 'on' : ''}" data-cat="${i}"><i style="background:${catColor(c.key)}"></i><span>${esc(c.label)}</span><small>${state.questions.filter((q, qi) => qCats(qi).some(x => x.key === c.key)).length} q</small></button>`).join('')}</div>
        <button class="sb-add" id="add-cat">${svg(I.plus)}Add category</button>`;
      $('[data-golanding]', el).onclick = () => go('landing');
      $('[data-goresults]', el).onclick = () => go('results');
      $$('[data-oq]', el).forEach(o => o.onclick = () => { SEL = { type: 'q', i: +o.dataset.oq }; drawSub(); drawCanvas(); drawPanel(); });
      $$('[data-cat]', el).forEach(b => b.onclick = () => { SEL = { type: 'cat', i: +b.dataset.cat }; drawSub(); drawCanvas(); drawPanel(); });
      $('#add-q').onclick = addQuestion;
      $('#add-cat').onclick = () => { const key = slugKey('category', state.categories.map(c => c.key)); state.categories.push({ key, label: 'New category' }); state.questions.forEach(q => q.options.forEach(o => { o.score[key] = 0; })); SEL = { type: 'cat', i: state.categories.length - 1 }; changed(); drawAll(); setTimeout(() => { const f = $('#cat-name'); f && (f.focus(), f.select()); }, 30); };
      bindOutlineDrag();
    } else if (AREA === 'results') {
      const s = sortedTiers();
      el.innerHTML = `
        <div class="sb-sub-head"><b>Score tiers</b><span>${state.tiers.length}</span></div>
        <p class="sb-hint">Every lead lands in one tier by their overall score. Each tier gets its own result.</p>
        <div class="sb-tierbar">${s.slice().reverse().map(({ t, i }) => { const w = tierMax(i) - t.min + 1; return `<span style="flex:${Math.max(w, 4)};background:${TIER_COLORS[i % TIER_COLORS.length]}" title="${esc(t.label)}: ${t.min}–${tierMax(i)}%"></span>`; }).join('')}</div>
        <div class="sb-tierscale"><span>0%</span><span>100%</span></div>
        <div class="sb-tiers">${s.map(({ t, i }) => `<button class="sb-tier ${TIER === i ? 'on' : ''}" data-tier="${i}"><i style="background:${TIER_COLORS[i % TIER_COLORS.length]}"></i><span><b>${esc(t.label)}</b><small>${t.min}–${tierMax(i)}%</small></span>${t.recommendationUrl ? '<em title="Has a button">✓</em>' : ''}</button>`).join('')}</div>
        ${state.tiers.length < 5 ? `<button class="sb-add" id="add-tier">${svg(I.plus)}Add tier</button>` : ''}`;
      $$('[data-tier]', el).forEach(b => b.onclick = () => { TIER = +b.dataset.tier; SEL = { type: 'tier', i: TIER }; drawSub(); drawCanvas(); drawPanel(); });
      const at = $('#add-tier', el); if (at) at.onclick = addTier;
    } else el.innerHTML = '';
  }
  function bindOutlineDrag() {
    let from = null;
    $$('[data-oq]').forEach(item => {
      item.addEventListener('dragstart', (e) => { from = +item.dataset.oq; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
      item.addEventListener('dragend', () => { item.classList.remove('dragging'); $$('.sb-oq').forEach(x => x.classList.remove('over')); });
      item.addEventListener('dragover', (e) => { e.preventDefault(); $$('.sb-oq').forEach(x => x.classList.toggle('over', x === item)); });
      item.addEventListener('drop', (e) => {
        e.preventDefault(); const to = +item.dataset.oq; if (from === null || from === to) return;
        const [q] = state.questions.splice(from, 1); state.questions.splice(to, 0, q);
        if (SEL.type === 'q') SEL.i = SEL.i === from ? to : SEL.i; changed(); drawAll();
      });
    });
  }

  // the middle: the real page, editable in place
  const ptsOf = (qi, o) => { const v = qCats(qi).map(cc => Number(o.score[cc.key] || 0)).reduce((a, x) => (Math.abs(x) > Math.abs(a) ? x : a), 0); return Math.round(v * 10) / 10; };
  function editable(key, value, ph, cls = '', multi = false) {
    return `<span class="sb-ed ${cls}" contenteditable="true" spellcheck="true" data-edit="${key}" data-ph="${esc(ph)}" ${multi ? 'data-multi="1"' : ''}>${esc(value || '')}</span>`;
  }
  function drawCanvas() {
    const c = $('#canvas');
    $('#canvas-bar').innerHTML = ['questions', 'landing', 'results'].includes(AREA)
      ? `<span class="sb-cb-tip">${svg(I.wand)}Click any text on the page to edit it</span><div class="sb-device"><button class="${DEVICE === 'desktop' ? 'on' : ''}" data-device="desktop" title="Desktop">${svg(I.desk)}</button><button class="${DEVICE === 'mobile' ? 'on' : ''}" data-device="mobile" title="Phone">${svg(I.phone)}</button></div>`
      : '';
    $$('[data-device]').forEach(b => b.onclick = () => { DEVICE = b.dataset.device; drawCanvas(); });
    c.className = 'sb-canvas ' + (DEVICE === 'mobile' ? 'mobile' : '') + (['settings', 'share'].includes(AREA) ? ' plain' : '');
    const b = esc(brand());
    if (AREA === 'landing' || (AREA === 'questions' && SEL.type === 'landing')) {
      const n = state.questions.length;
      c.innerHTML = `<div class="sb-page sb-landing">
        <div class="sb-cover ${state.coverImage ? '' : 'empty'}" ${state.coverImage ? `style="background-image:url('${esc(state.coverImage)}')"` : ''} data-pick="cover"><span class="sb-cover-edit">${svg(I.img)}${state.coverImage ? 'Change cover' : 'Add a cover image'}</span></div>
        <div class="sb-pad">
          ${editable('brand', state.brandName || '', brand(), 'sb-brand')}
          ${editable('title', state.title, 'Your scorecard title', 'sb-h1')}
          ${editable('intro', state.intro, 'One or two sentences on what they will find out.', 'sb-intro', true)}
          <div class="sb-meta"><span>⏱ ${Math.max(1, Math.round(n * 0.25))} min</span><span>${n} question${n === 1 ? '' : 's'}</span><span>Free</span></div>
          <div class="sb-start">Start the scorecard →</div>
        </div></div>`;
    } else if (AREA === 'questions') {
      if (SEL.type === 'cat') {
        const cat = state.categories[SEL.i]; const v = 72;
        c.innerHTML = `<div class="sb-page"><div class="sb-pad">
          <div class="sb-brand-static">${b}</div><p class="sb-caption">How "${esc(cat.label)}" shows on a lead's result</p>
          <div class="sb-catcard"><div class="sb-cc-top"><b>${esc(cat.label)}</b><span style="color:${catColor(cat.key)}">${v}%</span></div><div class="sb-bar"><i style="width:${v}%;background:${catColor(cat.key)}"></i></div>
            <p class="sb-cc-head">${editable('cat-headline:' + SEL.i, cat.headline || '', 'Headline for this category (leave blank and Sieve writes it)', 'sb-h3')}</p>
            <p class="sb-cc-msg">${esc(cat.highMessage || cat.lowMessage || 'Sieve writes a personal message here from their score in this category.')}</p></div>
        </div></div>`;
      } else if (!state.questions.length) {
        c.innerHTML = `<div class="sb-page"><div class="sb-pad sb-empty"><h3>No questions yet</h3><p>Add your first question to start building your scorecard.</p><button class="sb-btn primary" id="empty-add">${svg(I.plus)}Add a question</button></div></div>`;
        $('#empty-add').onclick = addQuestion;
      } else {
        const qi = Math.max(0, Math.min(SEL.i, state.questions.length - 1)), q = state.questions[qi], n = state.questions.length;
        c.innerHTML = `<div class="sb-page"><div class="sb-pad">
          <div class="sb-brand-static">${b}</div>
          <div class="sb-prog"><i style="width:${Math.round(((qi + 1) / n) * 100)}%"></i></div><div class="sb-count">Question ${qi + 1} of ${n}</div>
          ${editable('q:' + qi, q.text, 'Type your question', 'sb-h2', true)}
          ${isAboutQ(q) ? '<div class="sb-about-chip">About you · not scored</div>' : ''}
          ${isTextQ(q) ? '<div class="sb-textbox">Their answer goes here, in their own words</div>' : `<div class="sb-answers ${q.format === 'scale' ? 'scale' : ''}">${q.options.map((o, oi) => `<div class="sb-ans ${o.help ? 'help' : ''}"><span class="sb-letter">${q.format === 'scale' ? oi + 1 : (o.help ? '✋' : LETTERS[oi] || oi + 1)}</span>${editable(`o:${qi}:${oi}`, o.label, 'Answer text', 'sb-ans-t')}${isAboutQ(q) ? '' : `<span class="sb-ans-pts" title="Points">${ptsOf(qi, o)}</span>`}${q.options.length > 2 && !isGenQ(q) ? `<button class="sb-ans-x" data-delopt="${oi}" title="Remove answer">×</button>` : ''}</div>`).join('')}
            ${isGenQ(q) ? '' : `<button class="sb-ans add" id="add-opt">${svg(I.plus)}Add an answer</button>`}</div>`}
        </div></div>`;
        const addOpt = $('#add-opt'); if (addOpt) addOpt.onclick = () => { const score = {}; state.categories.forEach(cc => { score[cc.key] = 0; }); q.options.push({ label: '', score }); changed(); drawCanvas(); drawPanel(); setTimeout(() => { const e = $$('[data-edit^="o:' + qi + ':"]').pop(); e && e.focus(); }, 20); };
        $$('[data-delopt]').forEach(x => x.onclick = () => { q.options.splice(+x.dataset.delopt, 1); changed(); drawCanvas(); drawPanel(); });
      }
    } else if (AREA === 'results') {
      const t = state.tiers[TIER] || state.tiers[0]; if (!t) { c.innerHTML = ''; return; }
      const hi = tierMax(TIER), score = Math.round((t.min + hi) / 2), color = TIER_COLORS[TIER % TIER_COLORS.length];

        </div>
        ${field('Typical signs <span class="sb-opt">Optional</span>', `<textarea id="t-signs" rows="4" class="sb-in" placeholder="One per line, e.g. You often hear about problems from customers first">${esc((t.signs || []).join('\n'))}</textarea>`, 'Things people in this tier will recognise about themselves. Shown on their result under "Sound familiar?".')}
        <div class="sb-callout soft">The headline, message and line above the button are edited right on the page. Leave any blank and Sieve writes it for each lead.</div>
      </div>`;
    $('#t-label').oninput = (e) => { t.label = e.target.value; changed(); };
    $('#t-label').onchange = () => { drawSub(); drawCanvas(); };
    const mi = $('#t-min');
    mi.onchange = () => {
      const pos = s.findIndex(x => x.i === TIER), above = pos > 0 ? s[pos - 1].t.min : 101, below = pos < s.length - 1 ? s[pos + 1].t.min : -1;
      let v = Math.round(Number(mi.value) || 0);
      if (v <= below) { v = below + 1; showToast(`Must be above ${below}% (the tier below).`, 'info'); }
      if (v >= above) { v = above - 1; showToast(`Must be below ${above}% (the tier above).`, 'info'); }
      t.min = v; mi.value = v; changed(); drawSub(); drawCanvas(); drawPanel();
    };
    $('#t-url').onchange = (e) => { let v = e.target.value.trim(); if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v; t.recommendationUrl = v; e.target.value = v; changed(); drawSub(); drawCanvas(); };
    $('#t-btn').oninput = (e) => { t.recommendationLabel = e.target.value; changed(); };
    $('#t-signs').oninput = (e) => { t.signs = e.target.value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 6); changed(); };
    $('#t-btn').onchange = () => drawCanvas();
    $$('[data-btnq]', p).forEach(b => b.onclick = () => { t.recommendationLabel = b.dataset.btnq; $('#t-btn').value = b.dataset.btnq; changed(); drawCanvas(); });
    const dt = $('[data-deltier]', p); if (dt) dt.onclick = async () => {
      if (!(await showConfirm(`Delete the "${t.label}" tier? Leads in its range move to the tier below.`))) return;
      state.tiers.splice(TIER, 1);
      const ss = sortedTiers(); ss[ss.length - 1].t.min = 0;
      TIER = ss[0].i; SEL = { type: 'tier', i: TIER }; changed(); drawAll();
    };
  }
  function addTier() {
    // split the widest tier in half
    const s = sortedTiers(); let best = s[0], bw = -1;
    s.forEach(x => { const w = tierMax(x.i) - x.t.min; if (w > bw) { bw = w; best = x; } });
    // the new tier takes the lower half of the widest range, so the tiers above it (and their buttons) stay put
    const mid = Math.round((best.t.min + tierMax(best.i)) / 2) + 1;
    if (mid <= best.t.min || mid > tierMax(best.i)) return showToast('There is no room for another tier.', 'info');
    const lowStart = best.t.min; best.t.min = mid;
    state.tiers.push({ min: lowStart, label: 'New tier' });
    TIER = state.tiers.length - 1; SEL = { type: 'tier', i: TIER }; changed(); drawAll();
    setTimeout(() => { const f = $('#t-label'); f && (f.focus(), f.select()); }, 30);
  }
  function addQuestion() {
    const score = {}; state.categories.forEach(c => { score[c.key] = 0; });
    const cat0 = state.categories.slice(0, 1).map(c => c.key);
    state.questions.push({ text: '', kind: 'score', format: 'yesno', points: 3, cats: cat0, helpOption: true, options: [] });
    const qi = state.questions.length - 1;
    activeCats[qi] = new Set(cat0);
    state.questions[qi].options = SieveQ.buildOptions(state.questions[qi]);
    AREA = 'questions'; SEL = { type: 'q', i: qi }; drawAll();
    setTimeout(() => { const t = $(`[data-edit="q:${qi}"]`); t && t.focus(); }, 30);
  }
  async function uploadCover(file) {
    try {
      showToast('Uploading cover…', 'info');
      const form = new FormData(); form.append('cover', file);
      const res = await fetch('/api/scorecards/upload-cover', { method: 'POST', credentials: 'include', body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Upload failed.');
      state.coverImage = data.url; changed(); drawCanvas(); drawPanel(); showToast('Cover image added', 'success');
    } catch (err) { showToast(err.message || 'Upload failed.'); }
  }
  $('#cover-upload-input').onchange = (e) => { const f = e.target.files[0]; if (f) uploadCover(f); e.target.value = ''; };

  /* ---------- settings ---------- */
  function drawSettings(c) {
    const pc = state.profileCapture || (state.profileCapture = {});
    const fields = [['captureAge', 'Age range'], ['captureGender', 'Gender'], ['captureLocation', 'State (location)'], ['captureSocialClass', 'Income bracket']];
    c.innerHTML = `<div class="sb-doc">
      <h1>Settings</h1>
      <div class="sb-card"><div class="sb-card-h"><div><h3>Lead details</h3><p>Before their result, every lead gives their first name, last name, phone number and email.</p></div><span class="sb-badge">Always on</span></div></div>
      <div class="sb-card ${pc.enabled ? 'on' : ''}"><div class="sb-card-h"><div><h3>Audience insights <span class="sb-tag">Signal Desk</span></h3><p>Ask a few profile questions for a brand campaign. Powers the Brand Campaign Insight Report.</p></div><label class="sb-switch"><input type="checkbox" id="pc-enabled" ${pc.enabled ? 'checked' : ''}><span></span></label></div>
        ${pc.enabled ? `<div class="sb-card-b"><div class="sb-gt">What to ask</div><div class="sb-chips">${fields.map(([k, l]) => `<button class="sb-chip tog ${pc[k] ? 'on' : ''}" data-pc="${k}" style="--c:#3B5BFD">${pc[k] ? '✓ ' : '+ '}${l}</button>`).join('')}</div>
          ${field('Interest question <span class="sb-opt">Optional</span>', `<input id="pc-q" class="sb-in" value="${esc(pc.interestQuestion || '')}" placeholder="e.g. Which best describes your interest in [Brand]?" />`)}
          <div class="sb-f"><span>Answer choices</span><div class="sb-tags">${(pc.interestOptions || []).map((t, i) => `<span class="sb-tagx">${esc(t)}<button data-rmtag="${i}">×</button></span>`).join('')}<input id="pc-tag" placeholder="${(pc.interestOptions || []).length ? 'Add another…' : 'Type a choice and press Enter'}" /></div></div></div>` : ''}</div>
      <div class="sb-card ${state.engagementMode ? 'on' : ''}"><div class="sb-card-h"><div><h3>Engagement campaign</h3><p>Shows leads their completion time and a shareable result, and adds time-spent stats to your report.</p></div><label class="sb-switch"><input type="checkbox" id="eng" ${state.engagementMode ? 'checked' : ''}><span></span></label></div>
        ${state.engagementMode ? `<div class="sb-card-b">${field('Share message <span class="sb-opt">Optional</span>', `<textarea id="share-t" rows="2" class="sb-in" placeholder="I scored {score}% on {title}! Check yours: {link}">${esc(state.shareTemplate || '')}</textarea>`)}<div class="sb-chips">${['{score}', '{title}', '{brand}', '{tier}', '{link}'].map(t => `<button class="sb-chip mono" data-token="${t}">${t}</button>`).join('')}</div></div>` : ''}</div>
    </div>`;
    $('#pc-enabled').onchange = (e) => { pc.enabled = e.target.checked; changed(); drawCanvas(); };
    $$('[data-pc]').forEach(b => b.onclick = () => { pc[b.dataset.pc] = !pc[b.dataset.pc]; changed(); drawCanvas(); });
    const q = $('#pc-q'); if (q) q.oninput = (e) => { pc.interestQuestion = e.target.value; changed(); };
    const tg = $('#pc-tag'); if (tg) tg.onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ',') && tg.value.trim()) { e.preventDefault(); (pc.interestOptions ||= []).push(tg.value.trim().replace(/,$/, '')); changed(); drawCanvas(); setTimeout(() => $('#pc-tag')?.focus(), 10); } };
    $$('[data-rmtag]').forEach(b => b.onclick = () => { pc.interestOptions.splice(+b.dataset.rmtag, 1); changed(); drawCanvas(); });
    $('#eng').onchange = (e) => { state.engagementMode = e.target.checked; changed(); drawCanvas(); };
    const st = $('#share-t'); if (st) st.oninput = (e) => { state.shareTemplate = e.target.value; changed(); };
    $$('[data-token]').forEach(b => b.onclick = () => { const t = $('#share-t'), s = t.selectionStart ?? t.value.length; t.value = t.value.slice(0, s) + b.dataset.token + t.value.slice(t.selectionEnd ?? s); state.shareTemplate = t.value; t.focus(); changed(); });
  }

  /* ---------- publish and share ---------- */
  function checks() {
    return [
      ['Give it a title', !!state.title.trim(), 'landing'],
      ['Write a short intro', !!(state.intro || '').trim(), 'landing'],
      ['Every question has text and 2+ answers', state.questions.length > 0 && state.questions.every(qValid), 'questions'],
      ['Every scored question scores towards a category', state.questions.some(q => !isAboutQ(q)) && state.questions.every((q, i) => isAboutQ(q) || qCats(i).length > 0), 'questions'],
      ['A button for your top tier', !!sortedTiers()[0]?.t.recommendationUrl, 'results', true],
    ];
  }
  function drawShare(c) {
    const list = checks(), blocking = list.filter(x => !x[1] && !x[3]);
    if (!state.published) {
      c.innerHTML = `<div class="sb-doc"><h1>Publish</h1><p class="sb-lead">Go live to get a link for WhatsApp, your bio, ads or a QR code.</p>
        <div class="sb-card"><div class="sb-checks">${list.map(([t, ok, a, opt]) => `<button class="sb-check ${ok ? 'ok' : ''}" data-fix="${a}"><span class="sb-tick">${ok ? '✓' : ''}</span><span>${t}${opt ? ' <span class="sb-opt">Recommended</span>' : ''}</span>${ok ? '' : '<b>Fix →</b>'}</button>`).join('')}</div></div>
        <div class="sb-golive"><div><h3>${blocking.length ? 'Almost there' : 'Ready to go live'}</h3><p>${blocking.length ? 'Finish the items above to publish.' : 'You can unpublish any time.'}</p></div><button class="sb-btn primary big" id="publish-btn" ${blocking.length ? 'disabled' : ''}>Publish scorecard</button></div></div>`;
      $$('[data-fix]').forEach(b => b.onclick = () => go(b.dataset.fix));
      const pb = $('#publish-btn'); if (pb) pb.onclick = () => togglePublish(true);
      return;
    }
    const url = liveUrl(), title = state.title;
    const wa = `Hi! ${title} — take this quick assessment from ${(state.brandName && state.brandName.trim()) || 'us'} and get your results instantly: ${url}`;
    const embed = `<iframe src="${url}&embed=1" style="width:100%;max-width:520px;height:640px;border:0;" title="${title.replace(/"/g, '&quot;')}"></iframe>`;
    c.innerHTML = `<div class="sb-doc"><h1>Your scorecard is live 🎉</h1><p class="sb-lead">Share it anywhere. New leads land in your dashboard, already scored.</p>
      <div class="sb-card live"><div class="sb-gt">Your link</div><div class="sb-copy"><input id="share-link" value="${esc(url)}" readonly /><button class="sb-btn primary" data-copy="share-link">Copy</button></div>
        <div class="sb-sharegrid">
          <a class="sb-share wa" href="https://wa.me/?text=${encodeURIComponent(wa)}" target="_blank" rel="noopener">WhatsApp</a>
          <a class="sb-share" href="${esc(url)}" target="_blank" rel="noopener">Open live page</a>
          <a class="sb-share" href="/report.html?id=${scorecardId}">View report</a>
          <a class="sb-share" href="/leads.html?id=${scorecardId}">See leads</a></div></div>
      <div class="sb-twocards"><div class="sb-card"><div class="sb-gt">WhatsApp Status or broadcast</div><textarea id="wa-text" class="sb-in" rows="4" readonly>${esc(wa)}</textarea><button class="sb-btn ghost" data-copy="wa-text">Copy message</button></div>
        <div class="sb-card"><div class="sb-gt">QR code</div><img src="/api/scorecards/${scorecardId}/qr.png" alt="QR code" width="130" height="130" class="sb-qr" /><a class="sb-btn ghost" href="/api/scorecards/${scorecardId}/qr.png" download>Download QR</a></div></div>
      <details class="sb-card"><summary>Embed on your website</summary><div class="sb-copy" style="margin-top:10px"><input id="embed-code" value="${esc(embed)}" readonly /><button class="sb-btn ghost" data-copy="embed-code">Copy</button></div></details>
      <div class="sb-unpub"><span>Unpublishing stops new leads until you publish again.</span><button class="sb-link danger" id="unpublish">Unpublish</button></div></div>`;
    $$('[data-copy]').forEach(b => b.onclick = async () => { const el = $('#' + b.dataset.copy); try { await navigator.clipboard.writeText(el.value); } catch { el.select(); document.execCommand('copy'); } showToast('Copied', 'success'); });
    $('#unpublish').onclick = async () => { if (await showConfirm('Unpublish this scorecard? The link stops accepting new leads until you publish again.')) togglePublish(false); };
  }
  async function togglePublish(on) {
    try {
      await save();
      const { scorecard: u } = await api(`/scorecards/${scorecardId}/publish`, { method: 'POST', body: { published: on } });
      state.published = u.published; state.slug = u.slug;
      if (on) showToast('Your scorecard is live', 'success');
      go('share');
    } catch (ex) { showToast(ex.message || 'Could not change the publish status.'); }
  }

  /* ---------- top bar ---------- */
  $('#top-title').oninput = (e) => { state.title = e.target.value; changed(); };
  $('#publish-top').onclick = () => go('share');
  $('#preview-btn').onclick = async () => { const win = window.open('', '_blank'); await save(); if (win) win.location.href = `/take/index.html?slug=${state.slug}&preview=1`; };
  window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (AREAS.some(a => a.key === k) && k !== AREA) go(k); });

  (async () => {
    USER = await requireUser();
    if (!USER) return;
    const { scorecard } = await api(`/scorecards/${scorecardId}`);
    state = scorecard;
    state.profileCapture ||= { enabled: false, interestOptions: [] };
    if (!state.categories.length) state.categories = [{ key: 'fit', label: 'Fit' }];
    if (!state.tiers.length) state.tiers = [{ min: 70, label: 'Hot lead' }, { min: 40, label: 'Warm lead' }, { min: 0, label: 'Cold lead' }];
    TIER = sortedTiers()[0].i;
    if (AREA === 'results') SEL = { type: 'tier', i: TIER }; else if (AREA === 'landing') SEL = { type: 'landing' }; else if (AREA !== 'questions') SEL = { type: AREA };
    drawAll();
    setStatus('saved', 'All changes saved');
  })();
  </script>
</body>
</html>
